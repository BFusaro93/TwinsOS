version: 2
updates:
  - package-ecosystem: npm
    directory: /
    schedule:
      interval: weekly
    open-pull-requests-limit: 5
    groups:
      # stripe-js and react-stripe-js pin each other's major via peerDependencies,
      # so they must always be bumped in the same PR.
      stripe:
        patterns: ["@stripe/*"]
      minor-and-patch:
        update-types: [minor, patch]
  - package-ecosystem: github-actions
    directory: /
    schedule:
      interval: monthly
