version: 2
updates:
  - package-ecosystem: npm
    directory: /
    schedule:
      interval: weekly
    open-pull-requests-limit: 5
    # Major bumps (stripe, tailwind, zod, recharts...) break the build and need
    # a deliberate migration, so Dependabot doesn't open PRs for them. Upgrade
    # majors by hand on a schedule. Minor/patch PRs are unaffected.
    ignore:
      - dependency-name: "*"
        update-types: ["version-update:semver-major"]
    groups:
      # stripe-js and react-stripe-js pin each other's major via peerDependencies,
      # so they must always be bumped in the same PR.
      stripe:
        patterns: ["@stripe/*"]
      # One weekly PR for everything low-risk. Major bumps are deliberately not
      # grouped: each one is its own PR so a break is attributable and can be
      # tested (or ignored) on its own.
      minor-and-patch:
        update-types: [minor, patch]
  - package-ecosystem: github-actions
    directory: /
    schedule:
      interval: monthly
    groups:
      github-actions:
        patterns: ["*"]
