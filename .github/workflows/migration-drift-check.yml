name: Migration drift check

# Catches the exact failure mode from PR #68: a migration file committed
# with a version that doesn't match what actually got applied to
# production (or a schema change applied directly to prod with no
# migration file at all). Compares supabase/migrations/ against
# production's supabase_migrations.schema_migrations table and fails the
# build on any drift beyond the documented baseline.
#
# Requires a repo secret SUPABASE_DB_URL: a Postgres connection string for
# the production project. Use the connection pooler, not the direct
# db.<project-ref>.supabase.co:5432 host — that host is IPv6-only on many
# projects, and GitHub-hosted runners have no IPv6 egress ("Network is
# unreachable"). The pooler is IPv4-compatible:
#   postgresql://postgres.mhphatxiqxbscivffejl:[DB_PASSWORD]@aws-1-us-east-1.pooler.supabase.com:6543/postgres
# Note the username becomes postgres.<project-ref> (not just postgres) for
# the pooler, and the cluster number (aws-1 here) is assigned per-project —
# it is NOT derivable from the region alone, so don't guess it for a
# different project. Get the exact value from the Supabase dashboard's
# "Connect" button (top of the project page) > ORM tab > Prisma, which
# shows the real DATABASE_URL/DIRECT_URL pooler hosts for this project.
# Add the secret at: repo Settings > Secrets and variables > Actions > New
# repository secret.

on:
  pull_request:
    paths:
      - "supabase/migrations/**"
      - "supabase/.ci/migration-drift-baseline.json"
      - ".github/workflows/migration-drift-check.yml"

jobs:
  check-drift:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v7

      - name: Compare local migrations against production history
        env:
          DATABASE_URL: ${{ secrets.SUPABASE_DB_URL }}
        run: |
          set -euo pipefail

          if [ -z "${DATABASE_URL:-}" ]; then
            echo "::error::SUPABASE_DB_URL repo secret is not set — see comment at top of this workflow file for how to add it. Skipping would let real drift through, so this check fails closed."
            exit 1
          fi

          echo "== Local migration versions =="
          local_versions=$(ls supabase/migrations | sed -E 's/^([0-9]+)_.*\.sql$/\1/' | sort -u)
          echo "$local_versions" | wc -l

          echo "== Production migration versions (supabase_migrations.schema_migrations) =="
          remote_versions=$(psql "$DATABASE_URL" -t -A -c "select version from supabase_migrations.schema_migrations order by version;" | sed '/^$/d' | sort -u)
          echo "$remote_versions" | wc -l

          only_local_raw=$(comm -23 <(echo "$local_versions") <(echo "$remote_versions") || true)
          only_remote_raw=$(comm -13 <(echo "$local_versions") <(echo "$remote_versions") || true)

          baseline_local=$(python3 -c "import json,sys; print('\n'.join(json.load(open('supabase/.ci/migration-drift-baseline.json'))['knownLocalOnly']))")
          baseline_remote=$(python3 -c "import json,sys; print('\n'.join(json.load(open('supabase/.ci/migration-drift-baseline.json'))['knownRemoteOnly']))")

          only_local_new=$(comm -23 <(echo "$only_local_raw" | sed '/^$/d' | sort -u) <(echo "$baseline_local" | sort -u) || true)
          only_remote_new=$(comm -23 <(echo "$only_remote_raw" | sed '/^$/d' | sort -u) <(echo "$baseline_remote" | sort -u) || true)

          if [ -n "$only_local_new" ]; then
            echo "::notice::Local migration(s) not yet applied to production (expected if this PR adds new migrations that haven't been pushed yet):"
            echo "$only_local_new"
          fi

          if [ -n "$only_remote_new" ]; then
            echo "::error::Production has applied migration version(s) with no matching local file — migration history has drifted. This means either a migration was hand-timestamped instead of using 'supabase migration new', or a schema change was applied directly to prod without committing a migration file. Reconcile before merging (see PR #68 for the recovery process):"
            echo "$only_remote_new"
            exit 1
          fi

          echo "No new drift detected beyond the documented baseline in supabase/.ci/migration-drift-baseline.json."

      - name: Every org-scoped table enforces read-only mode
        env:
          DATABASE_URL: ${{ secrets.SUPABASE_DB_URL }}
        run: |
          set -euo pipefail
          # A canceled org / expired trial is read-only through RESTRICTIVE
          # read_only_when_canceled_* policies (20260926190000). New tables don't
          # get them automatically; re-run the idempotent DO block from
          # 20261220000600 in a new migration to fix this check.
          missing=$(psql "$DATABASE_URL" -t -A -c "
            select c.relname from pg_class c
              join pg_attribute a on a.attrelid = c.oid and a.attname = 'org_id' and not a.attisdropped
             where c.relnamespace = 'public'::regnamespace and c.relkind = 'r' and c.relrowsecurity
               and exists (select 1 from pg_policies p where p.schemaname = 'public' and p.tablename = c.relname and p.permissive = 'PERMISSIVE')
               and c.relname not in ('support_messages', 'support_conversations', 'notifications')
               and not exists (select 1 from pg_policies p where p.schemaname = 'public' and p.tablename = c.relname and p.policyname = 'read_only_when_canceled_ins')
             order by 1;" | sed '/^$/d')
          if [ -n "$missing" ]; then
            # Migrations reach production after merge, so a PR that brings the
            # fix (a migration re-stating these policies) passes with a notice.
            git fetch --no-tags --depth=1 origin "${{ github.base_ref }}"
            if git diff --name-only FETCH_HEAD HEAD -- supabase/migrations | xargs -r grep -l "read_only_when_canceled_ins" >/dev/null 2>&1; then
              echo "::notice::Production is missing read-only policies on: $(echo $missing) — this PR includes a migration that adds them; apply it to production after merge."
              exit 0
            fi
            echo "::error::These production tables are missing the read-only (canceled/expired) policies — re-run the DO block from supabase/migrations/20261220000600_read_only_policies_backfill_with_check.sql in a new migration:"
            echo "$missing"
            exit 1
          fi
          echo "All org-scoped tables enforce read-only mode."
